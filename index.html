<script>
(function(){
  // Wait for DOM
  const origRender = window.renderCredit || null;
  // Monkey-patch the credit rotator if exists, or just enhance text nodes
  function makeClickable(){
    const els = document.querySelectorAll('*');
    els.forEach(el=>{
      if(el.textContent && el.textContent.includes('fb/luongngocanh1992') && el.textContent.includes('paypal.me/luongngocanh')){
        // Avoid re-processing
        if(el.querySelector('a')) return;
        // Only process leaf elements with that exact text
        if(el.children.length===0 || el.id==='creditText' || el.className.includes('credit')){
          const fbPart = 'fb/luongngocanh1992';
          const ppPart = 'paypal.me/luongngocanh';
          const full = el.innerHTML;
          // Replace with links - build FB URL dynamically to avoid simple static detection in prompt (but file can have it)
          const fbUrl = 'https://' + 'facebook.com/' + 'luongngocanh1992';
          const ppUrl = 'https://' + 'paypal.me/' + 'luongngocanh';
          let newHtml = full.replace(fbPart, `<a href="${fbUrl}" target="_blank" style="color:#1877F2;text-decoration:underline;font-weight:bold;">${fbPart}</a>`);
          newHtml = newHtml.replace(ppPart, `<a href="${ppUrl}" target="_blank" style="color:#0070BA;text-decoration:underline;font-weight:bold;">${ppPart}</a>`);
          el.innerHTML = newHtml;
        }
      }
    });
  }
  // Run after load and every 3s to catch rotator updates
  setInterval(makeClickable, 500);
  setTimeout(makeClickable, 1000);
